{{ define "main" }}
<article class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-12 text-center">
        <h1 class="font-fredoka text-3xl md:text-4xl lg:text-5xl text-gray-900 dark:text-gray-100 mb-4 leading-tight">{{ .Title }}</h1>
        <div class="font-fjord flex items-center justify-center text-gray-500 dark:text-gray-400 text-sm">
            <time class="font-medium">{{ .Date.Format "Mon, Jan 2, 2006" }}</time>
        </div>
    </header>
    <div class="prose prose-lg prose-gray max-w-none mb-12">
        {{ .Content }}
    </div>
    <div class="border-t border-gray-200 dark:border-gray-700 pt-8 mb-8">
        <p class="font-fjord text-center text-gray-500 dark:text-gray-400 font-medium">-- end --</p>
    </div>
    <div class="flex flex-wrap gap-2 mb-8">
        {{ range (.GetTerms "categories") }}
        <a href="{{ .RelPermalink }}" class="inline-block bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 px-3 py-1 rounded-full text-sm font-medium hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors duration-200">{{ .LinkTitle }}</a>
        {{ end }}
    </div>
    <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-6">
        {{ partial "author" . }}
    </div>
</article>
<script type="application/ld+json">
    {{ partial "breadcrumbs-list" . | safeJS }}
</script>
{{ end }}
