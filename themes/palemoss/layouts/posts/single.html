{{ define "main" }}
<article class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-12 text-center">
        <h1 class="font-fredoka text-3xl md:text-4xl lg:text-5xl text-stone-900 dark:text-stone-100 mb-4 leading-tight">{{ .Title }}</h1>
        <div class="font-fjord flex items-center justify-center text-stone-500 dark:text-stone-400 text-sm">
            <time class="font-medium">{{ .Date.Format "Mon, Jan 2, 2006" }}</time>
        </div>
    </header>
    <div class="prose prose-lg prose-gray dark:prose-invert max-w-none mb-12">
        {{ .Content }}
    </div>
    <hr class="border-stone-200 dark:border-stone-700 my-8">
    <p class="font-fjord text-center text-stone-500 dark:text-stone-400 font-medium mb-8">-- end --</p>
    <div class="flex flex-wrap gap-2 mb-8">
        {{ range (.GetTerms "categories") }}
        <a href="{{ .RelPermalink }}" class="inline-block bg-palemoss-100 dark:bg-palemoss-900 text-palemoss-800 dark:text-palemoss-200 px-3 py-1 rounded-full text-sm font-medium hover:bg-palemoss-200 dark:hover:bg-palemoss-800 transition-colors duration-200">{{ .LinkTitle }}</a>
        {{ end }}
    </div>
    {{ partial "author" . }}
</article>
<script type="application/ld+json">
    {{ partial "breadcrumbs-list" . | safeJS }}
</script>
{{ end }}
