<div class="p-6">
    <div class="font-fjord flex flex-wrap items-center gap-2 text-sm text-gray-500 dark:text-gray-400 mb-3">
        <time class="font-medium">{{ .Date.Format "2 Jan, 2006" }}</time>
        <span>&sdot;</span>
        <span>in</span>
        {{ $taxo := "categories" }}
        {{ range .Params.categories }}
        {{ $name := . }}
        {{ with $.Site.GetPage (printf "/%s/%s" $taxo $name) }}
        <a href="{{ .RelPermalink }}" class="inline-block bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 px-2 py-1 rounded-full text-xs font-medium hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors duration-200">{{ $name }}</a>
        {{ end }}
        {{ end }}
    </div>
    <h3 class="font-fredoka text-xl md:text-2xl text-gray-900 dark:text-gray-100 mb-3 leading-tight">
        <a href="{{ .RelPermalink }}" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-200">{{ .Title }}</a>
    </h3>
    <p class="font-fjord text-gray-600 dark:text-gray-400 leading-relaxed">{{ .Summary | plainify }}</p>
    <a href="{{ .RelPermalink }}" class="font-fjord inline-flex items-center text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-medium transition-colors duration-200 mt-4">
        Read post
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
    </a>
</div>
