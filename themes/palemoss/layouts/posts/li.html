<div class="p-6">
    <div class="flex flex-wrap items-center gap-2 text-sm text-gray-500 mb-3">
        <time class="font-medium">{{ .Date.Format "2 Jan, 2006" }}</time>
        <span>&sdot;</span>
        <span>in</span>
        {{ $taxo := "categories" }}
        {{ range .Params.categories }}
        {{ $name := . }}
        {{ with $.Site.GetPage (printf "/%s/%s" $taxo $name) }}
        <a href="{{ .RelPermalink }}" class="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs font-medium hover:bg-blue-200 transition-colors duration-200">{{ $name }}</a>
        {{ end }}
        {{ end }}
    </div>
    <h3 class="text-xl md:text-2xl font-bold text-gray-900 mb-3 leading-tight">
        <a href="{{ .RelPermalink }}" class="hover:text-blue-600 transition-colors duration-200">{{ .Title }}</a>
    </h3>
    <p class="text-gray-600 leading-relaxed">{{ .Summary | plainify }}</p>
    <div class="mt-4">
        <a href="{{ .RelPermalink }}" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium transition-colors duration-200">
            Read more
            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </a>
    </div>
</div>
