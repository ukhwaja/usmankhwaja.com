{{ define "main" }}
<main class="max-w-4xl mx-auto px-4 py-16 text-center">
    <h1 class="font-fredoka text-6xl md:text-8xl text-stone-300 dark:text-stone-700 mb-4">
        404
    </h1>
    <h2 class="font-fredoka text-2xl md:text-3xl text-stone-900 dark:text-stone-100 mb-6">
        Page not found
    </h2>
    <p class="font-fjord text-stone-600 dark:text-stone-400 mb-8 max-w-md mx-auto">
        The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="font-fjord inline-flex items-center px-6 py-3 bg-palemoss-600 dark:bg-palemoss-700 text-white rounded-lg hover:bg-palemoss-700 dark:hover:bg-palemoss-600 transition-colors duration-200 font-medium">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Go Home
    </a>
</main>
{{ end }}
