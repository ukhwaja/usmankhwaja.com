<!DOCTYPE html>
<html lang="{{.Site.LanguageCode}}">

{{ partial "head" . }}

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-fjord leading-relaxed">
    {{ if not (eq .Kind "home") }}
    <nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-4xl mx-auto px-4 py-4">
        <a href="/" class="inline-flex items-center text-palemoss-600 dark:text-palemoss-400 hover:text-palemoss-800 dark:hover:text-palemoss-300 font-medium transition-colors duration-200">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Home
        </a>
        </div>
    </nav>
    {{ end }}
    <div id="content" class="min-h-screen">
        {{ block "main" . }}{{ end }}
    </div>
    {{ if not (eq .Kind "404") }}
    {{ partial "footer" . }}
    <script type="application/ld+json">
        {{ partial "search-gallery" . | safeJS }}
    </script>
    {{ end }}
    {{ if hugo.IsProduction }}
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/serviceworker.js');
        }
    </script>
    {{ end }}
</body>

</html>
