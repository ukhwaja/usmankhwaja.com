{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="text-center mb-16">
        <div class="mb-6">
            <amp-img layout="fixed" width="100" height="100" src="/logo.webp" alt="UK" class="mx-auto rounded-full shadow-lg"></amp-img>
        </div>
        <h1 class="font-fredoka text-4xl md:text-5xl font-bold text-gray-900 dark:text-gray-100 mb-4">
            {{ .Title }}
        </h1>
        <h2 class="font-fjord text-xl md:text-2xl text-gray-600 dark:text-gray-300 max-w-2xl mx-auto leading-relaxed">
            {{ replaceRE "</?p>" "" .Site.Home.Content | safeHTML }}
        </h2>
    </div>
    <div class="space-y-8">
        {{ $paginator := .Paginate (.Site.RegularPages.ByPublishDate.Reverse) 5 }}
        {{ range $paginator.Pages }}
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden">
            {{ .Render "li"}}
        </div>
        {{ end }}
        <div class="mt-12">
        {{ partial "pagination" . }}
        </div>
    </div>
</div>
{{ end }}
