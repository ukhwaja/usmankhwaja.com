{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-8">
    <header class="text-center mb-16">
        <img width="100" height="100" src="/logo.webp" alt="UK" class="mx-auto rounded-full shadow-lg mb-6">
        <h1 class="font-fredoka text-4xl md:text-5xl text-stone-900 dark:text-stone-100 mb-4">
            {{ .Title }}
        </h1>
        <h2 class="font-fjord text-xl md:text-2xl text-stone-600 dark:text-stone-300 max-w-2xl mx-auto leading-relaxed">
            {{ replaceRE "</?p>" "" .Site.Home.Content | safeHTML }}
        </h2>
    </header>
    <div class="space-y-8">
        {{ $paginator := .Paginate (.Site.RegularPages.ByPublishDate.Reverse) 5 }}
        {{ range $paginator.Pages }}
        <div class="bg-white dark:bg-stone-800 rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden">
            {{ .Render "li"}}
        </div>
        {{ end }}
        {{ partial "pagination" . }}
    </div>
</div>
{{ end }}
