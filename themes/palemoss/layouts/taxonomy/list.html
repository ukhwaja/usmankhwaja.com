{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-8">
    <header class="text-center mb-12">
        <h1 class="font-fredoka text-3xl md:text-4xl text-stone-900 dark:text-stone-100 mb-4">{{ .Title }}</h1>
        <p class="font-fjord text-stone-600 dark:text-stone-400 text-lg">Browse posts by category</p>
    </header>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{ range .Data.Terms.ByCount }}
        <a href="{{ .Page.RelPermalink }}"
            class="group bg-white dark:bg-stone-800 rounded-lg shadow-md hover:shadow-lg transition-all duration-300 p-6 border border-stone-200 dark:border-stone-700 hover:border-palemoss-300 dark:hover:border-palemoss-600">
            <h3 class="font-fjord text-lg font-semibold text-stone-900 dark:text-stone-100 group-hover:text-palemoss-600 dark:group-hover:text-palemoss-400 transition-colors duration-200 flex items-center justify-between">
                {{ .Page.Title }}
                <span class="bg-palemoss-100 dark:bg-palemoss-900 text-palemoss-800 dark:text-palemoss-200 text-sm font-medium px-2.5 py-0.5 rounded-full">{{ .Count }}</span>
            </h3>
            <p class="font-fjord text-stone-500 dark:text-stone-400 text-sm mt-2">{{ .Count }} {{ if gt .Count 1 }}posts{{ else }}post{{ end }}</p>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
