<textarea id="textinput" on="input-throttled:AMP.setState({ length: event.value.length, maxlength: 20 })" cols="20" rows="3" maxlength="20" autocomplete="off" class="block p-2 border border-gray-300 dark:border-gray-600 rounded dark:bg-gray-800 dark:text-gray-100"></textarea>
<label for="textinput" class="mt-4 block"><span [text]="textCounter(length, maxlength)" class="text-lg mr-2 p-2 inline-block text-center bg-yellow-500 font-bold w-[3rem] text-gray-600">20</span><span>remaining characters</span></label>
<amp-bind-macro id="textCounter" arguments="length, maxlength" expression="maxlength - length" />
