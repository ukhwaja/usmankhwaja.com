<label>
    <textarea on="input-throttled:AMP.setState({ length: event.value.length, maxlength: 20 })" cols="20" rows="3" maxlength="20" autocomplete="off"></textarea>
    <span hidden [hidden]="length < 1" [text]="textCounter(length, maxlength)"></span>
    </label>
     <amp-bind-macro id="textCounter"
        arguments="length, maxlength"
        expression="maxlength - length" />
