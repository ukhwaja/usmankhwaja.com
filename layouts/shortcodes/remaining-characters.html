<label class="block space-y-2">
    <textarea on="input-throttled:AMP.setState({ length: event.value.length, maxlength: 20 })" cols="20" rows="3" maxlength="20" autocomplete="off" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded dark:bg-gray-800 dark:text-gray-100"></textarea>
    <span [text]="textCounter(length, maxlength)" class="text-lg p-2 bg-yellow-500 font-bold inline-flex justify-center w-[3rem] text-gray-600">20</span> remaining characters
</label>
<amp-bind-macro id="textCounter" arguments="length, maxlength" expression="maxlength - length" />
