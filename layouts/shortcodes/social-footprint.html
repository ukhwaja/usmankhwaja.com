<table class="w-full border-collapse">
    {{ range sort .Site.Data.footprint.footprint "title" "desc" }}
    <tr class="border-b border-gray-200 dark:border-gray-700">
        <td class="py-2 pr-4">
            <span class="flex items-center space-x-2">
                <img alt="{{substr .name 0 2}}" src="{{ .image }}" width="20" height="20" class="rounded">
                <strong class="text-gray-900 dark:text-gray-100">{{ .name }}</strong>
            </span>
        </td>
        <td class="py-2">
            <a rel="nofollow noreferrer" target="_blank" href="{{ .url }}" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">
                {{ .title }}
            </a>
        </td>
    </tr>
    {{ end }}
</table>
