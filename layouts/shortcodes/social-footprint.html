<table class="w-auto">
    <tbody>
    {{ range sort .Site.Data.footprint.footprint "title" "desc" }}
    <tr class="border-b border-stone-200 dark:border-stone-700">
        <td class="">
            <span class="flex items-center space-x-2">
                <img alt="{{substr .name 0 2}}" src="{{ .image }}" width="20" height="20" class="rounded">
                <span class="text-stone-900 dark:text-stone-100">{{ .name }}</span>
            </span>
        </td>
        <td class="align-middle">
            <a rel="nofollow noreferrer" target="_blank" href="{{ .url }}" class="text-palemoss-600 dark:text-palemoss-400 hover:text-palemoss-800 dark:hover:text-palemoss-300 transition-colors">
                {{ .title }}
            </a>
        </td>
    </tr>
    {{ end }}
    </tbody>
</table>
