<table>
    {{ range sort .Site.Data.footprint.footprint "title" "desc" }}
    <tr>
    <td>
    <span>
        <amp-img alt="{{substr .name 0 2}}" noloading src="{{ .image }}" width="20" height="20" layout="fixed"></amp-img>
        <strong>{{ .name }}</strong>
        </span>
    </td><td>
        <a rel="nofollow noreferrer" target="_blank" href="{{ .url }}">
            {{ .title }}</a>
    </td>
    </tr>
    {{ end }}
</table>
